# Input to `noise-collector provision`: writes collector.toml, initialises the state directory,
# checks the local measurement chain and fetches any published configuration. The collector reports
# its own profile and calibration to the server; placements are entered in the web app.

[paths]
state_dir = "/var/lib/noise-collector"
credentials_file = "/etc/noise-collector/credentials.toml"

[server]
base_url = "https://noise.example.com"
trusted_storage_hosts = ["*.r2.cloudflarestorage.com"]

[microphone]
model = "umik-1"
usb_path = "REPLACE-from-noise-collector-umik"   # e.g. "1-1.2"

[capture]
channels = 1                # native channel count from `noise-collector umik` (older UMIK-1 units: 2)

[calibration]
state = "estimated"
frequency_response_file = "/etc/noise-collector/REPLACE_90deg.txt"

[channel]
id = "mic-1"
