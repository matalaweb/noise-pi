# /etc/noise-collector/calibrations.toml (owner noise-collector, mode 0640)
# Absolute scale for a calibration record created in the web app. The web app does not (yet) send
# sensitivity values to the device, so the owner supplies them here, pinned to the calibration's
# content_hash shown by `noise-collector doctor` (or GET /configuration provenance). A new
# calibration revision in the web app invalidates this entry until it is updated.

[[calibration]]
id = "REPLACE-calibration-uuid"
content_hash = "REPLACE-64-hex"
method = "reference_measurement"         # or manufacturer_sensitivity / comparison_estimate (estimated profiles only)
sensitivity_dbfs_at_94db = -27.4         # RMS dBFS reading for 94 dB SPL at 1 kHz, from calibration-check
# pa_per_fs = 0.4733                     # alternative to sensitivity_dbfs_at_94db
# response_curve_file = "/etc/noise-collector/7103946_90deg.txt"   # optional frequency-response correction
# curve_is = "microphone_response"
# noise_floor_laeq_db = 21.5
# noise_floor_method = "sealed-box self-noise, 2026-10-01"
